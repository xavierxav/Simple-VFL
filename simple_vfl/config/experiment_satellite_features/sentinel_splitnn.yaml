# @package _global_

# Feature-level SplitNN baseline: one trainable 1536 -> 1000 encoder per
# Sentinel view, then a central linear head over 16 x 1000. Same capacity as the
# one-shot concatenation model, but the party encoders are trained end-to-end.
epochs: 50
k: 16
lr: 1e-3
batch_size: 512
hidden_dim: 1000

weight_decay: 0

dataset:
  features_instead : 'extracted_features_giant_rgb_light_preprocess'
  flips : false
  label_type: sources
  num_classes: 4

model: 'SentinelSplitNN'
