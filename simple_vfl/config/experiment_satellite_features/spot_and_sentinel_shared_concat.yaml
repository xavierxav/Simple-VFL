# @package _global_

# Shared Sentinel encoder + separate SPOT encoder, then concatenate the 17
# hidden vectors and classify. Matches the "one model for the 16 Sentinel
# images, plus SPOT" architecture.
epochs: 50
k: 17
lr: 1e-3
batch_size: 512
hidden_dim: 1000

weight_decay: 0

dataset:
  dataset_name: 'SPOTAndSentinelDataset'
  label_type: sources
  num_classes: 4
  features_instead: 'extracted_features_giant_rgb_light_preprocess'
  spot_features_instead: 'extracted_features_giant_ps_normalized'

model: 'SPOTandSentinelSharedConcatModel'
