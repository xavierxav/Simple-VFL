# @package _global_

# 2024 variant: one shared encoder for all 17 views (SPOT and Sentinel),
# then a linear head over the concatenated hidden vectors. Kept for
# provenance; on a POI-grouped split it does not beat SPOT alone.
epochs: 50
k: 17
lr: 1e-3
batch_size: 512
hidden_dim: 1000

weight_decay: 0

dataset:
  dataset_name: 'SPOTAndSentinelDataset'
  label_type: sources
  num_classes: 4
  features_instead: 'extracted_features_giant_rgb_light_preprocess'
  spot_features_instead: 'extracted_features_giant_ps_normalized'

model: 'SpecialModel'
