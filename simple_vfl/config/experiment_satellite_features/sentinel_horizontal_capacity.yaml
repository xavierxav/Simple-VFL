# @package _global_

# Capacity control for the 16-view Sentinel experiment: one random view per
# sample, but a 15,932-wide hidden layer so the head has ~24.58M parameters,
# matching the 16-view (24,576 -> 1000 -> 4) model.
epochs: 50
k: 1
lr: 1e-3
batch_size: 512
hidden_dim: 15932

weight_decay: 0

dataset:
  features_instead : 'extracted_features_giant_rgb_light_preprocess'
  dataset_name: 'HorizontalSentinelDataset'
  label_type: sources
  num_classes: 4

model: 'SatelliteFeaturesCentralized2layers'
