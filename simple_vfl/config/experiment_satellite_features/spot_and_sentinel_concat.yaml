# @package _global_

# Concatenate the raw 1536-d features of SPOT and the 16 Sentinel revisits,
# then one 2-layer head. No shared encoder.
epochs: 50
k: 17
lr: 1e-3
batch_size: 512
hidden_dim: 1000

weight_decay: 0

dataset:
  dataset_name: 'SPOTAndSentinelDataset'
  label_type: sources
  num_classes: 4
  features_instead: 'extracted_features_giant_rgb_light_preprocess'
  spot_features_instead: 'extracted_features_giant_ps_normalized'

model: 'SatelliteFeaturesCentralized2layers'
